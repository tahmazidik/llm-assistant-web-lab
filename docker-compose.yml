services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: llm
      POSTGRES_DB: llm-assistant
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:4
    volumes:
      - ./beckend/migrations:/migrations
    depends_on:
      - db
    entrypoint: [ "migrate", "-path", "/migrations", "-database", "postgres://llm:llm@db:5432/llm-assistant?sslmode=disable" ]
    command: [ "up" ]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: ./beckend/Dockerfile
    env_file:
      - ./beckend/.env
    environment:
      DB_DSN: postgres://llm:llm@db:5432/llm-assistant?sslmode=disable
      APP_HTTP_ADDR: :8080
      #OPENAI_API_KEY: 
    depends_on:
      - db
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # Публичный адрес API, который видно из браузера
      NUXT_PUBLIC_API_BASE: http://localhost:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"
volumes:
  pgdata:
