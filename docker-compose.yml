services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: llm
      POSTGRES_PASSWORD: llm
      POSTGRES_DB: llm-assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:4
    volumes:
      - ./beckend/migrations:/migrations
    depends_on:
      - db
    entrypoint: [
      "migrate",
      "-path", "/migrations",
      "-database", "postgres://llm:llm@db:5432/llm-assistant?sslmode=disable"
    ]

volumes:
  pgdata:
